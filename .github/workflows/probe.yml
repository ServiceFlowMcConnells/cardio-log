name: probe
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir p && cd p && npm pack @capgo/capacitor-health@8.11.13 >/dev/null && tar xzf *.tgz
          M=package/android/src/main/java/app/capgo/plugin/health/HealthManager.kt
          echo "=== save"; sed -n 488,530p $M
          echo "=== water"; grep -n -i "water\|hydration" $M package/android/src/main/java/app/capgo/plugin/health/*.kt | head -30
          echo "=== plugin save"; n=$(grep -n "fun saveSample" package/android/src/main/java/app/capgo/plugin/health/HealthPlugin.kt | cut -d: -f1); sed -n "${n},$((n+50))p" package/android/src/main/java/app/capgo/plugin/health/HealthPlugin.kt
          echo "=== defs save"; grep -n -B2 -A14 "interface SaveSampleOptions\|saveSample(" package/dist/esm/definitions.d.ts | head -60
      - working-directory: native
        run: |
          npm install --no-audit --no-fund >/dev/null 2>&1
          npx cap add android >/dev/null 2>&1
          echo "=== skip"
          echo "=== variables"; cat android/variables.gradle
          echo "=== root build.gradle"; cat android/build.gradle
