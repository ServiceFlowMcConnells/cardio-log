name: probe
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          V=8.11.13
          mkdir p && cd p && npm pack @capgo/capacitor-health@$V >/dev/null && tar xzf *.tgz
          echo "== peer"; npm view @capgo/capacitor-health@$V peerDependencies
          echo "== build.gradle"; cat package/android/build.gradle
          echo "== manifest"; cat package/android/src/main/AndroidManifest.xml
          echo "== android files"; find package/android/src -type f
          echo "== types"; sed -n 1,400p package/dist/esm/definitions.d.ts | grep -v "^\s*\*\|^\s*/\*\*" | head -230
          echo "== README android"; sed -n '/## Android/,/## Usage/p' package/README.md | head -80
          echo "== cap8"; npm view @capacitor/android@8 version | tail -2; npm view @capacitor/cli@8 engines
